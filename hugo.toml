baseURL = 'https://liu-yu-chen.github.io/'
languageCode = 'en'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Liu YuChen'
theme = 'tella-master'
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true
summaryLength = 30

[params]
  description = 'Liu YuChen — exploring health and social systems through data, network science, and agent-based modeling.'
  email = 'yuchen.liu@connect.um.edu.mo'

[languages.en]
  languageName = 'English'
  languageCode = 'en'
  contentDir = 'content/en'
  weight = 1
  title = 'Liu YuChen'
[languages.en.params]
  description = 'Liu YuChen — exploring health and social systems through data, network science, and agent-based modeling.'
[languages.zh]
  languageName = '中文'
  languageCode = 'zh-cn'
  contentDir = 'content/zh'
  weight = 2
  title = '刘雨辰'
[languages.zh.params]
  description = '刘雨辰的个人网站：用数据、网络科学与主体建模探索健康和社会系统，分享研究与生活。'

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  identifier = 'about'
  weight = 1
[[menus.main]]
  name = 'Research'
  pageRef = '/research'
  identifier = 'research'
  weight = 2
[[menus.main]]
  name = 'Gallery'
  pageRef = '/gallery'
  identifier = 'gallery'
  weight = 3
[[menus.main]]
  name = 'Notes'
  pageRef = '/notes'
  identifier = 'notes'
  weight = 4

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  style = 'github'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
