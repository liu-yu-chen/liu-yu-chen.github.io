<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#234c42">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/social-card.png" | absURL }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{ if .IsHome }}<link rel="stylesheet" href="{{ "css/splide.min.css" | relURL }}">{{ end }}
{{ $css := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ $researchCss := resources.Get "css/research-results.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $researchCss.RelPermalink }}" integrity="{{ $researchCss.Data.Integrity }}">
{{ range .AlternativeOutputFormats }}<link rel="alternate" type="{{ .MediaType.Type }}" title="{{ site.Title }} — {{ .Name }}" href="{{ .Permalink }}">{{ end }}

{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">{{ end }}
