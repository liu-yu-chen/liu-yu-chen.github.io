<article class="research-card project-card">
  <a class="research-visual visual-{{ .Params.visual }}" href="{{ .RelPermalink }}" aria-label="{{ .Title }}"><img src="{{ printf "images/%s.svg" .Params.visual | relURL }}" alt="" loading="lazy" width="640" height="360"><span class="card-arrow" aria-hidden="true">↗</span></a>
  <div class="card-body"><p class="eyebrow">{{ .Params.category }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><div class="card-meta"><span>{{ .Params.status }}</span></div><a class="text-link" href="{{ .RelPermalink }}">{{ if eq site.Language.Lang "zh" }}查看方法与已有结果{{ else }}View methods & existing results{{ end }} ↗</a></div>
</article>
