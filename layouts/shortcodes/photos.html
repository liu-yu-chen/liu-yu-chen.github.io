<div class="photo-grid">{{ range .Page.Params.photos }}<figure class="photo-item"><a class="photo-fallback" href="{{ .src | relURL }}"><img src="{{ .src | relURL }}" alt="{{ .caption }}" loading="lazy"></a><button class="photo-enhanced" data-photo="{{ .src | relURL }}" data-caption="{{ .caption }}" aria-label="{{ i18n "enlargePhoto" }}: {{ .caption }}"><img src="{{ .src | relURL }}" alt="{{ .caption }}" loading="lazy"></button><figcaption>{{ .caption }}</figcaption></figure>{{ end }}</div>
<dialog id="photo-lightbox" aria-label="{{ i18n "photoViewer" }}"><button autofocus aria-label="{{ i18n "close" }}">{{ i18n "close" }} ×</button><figure><img alt=""><figcaption></figcaption></figure></dialog>
