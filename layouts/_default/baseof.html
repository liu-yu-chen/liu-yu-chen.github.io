<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ if .IsHome }}<script src="{{ "js/splide.min.js" | relURL }}" defer></script>{{ end }}
  <script src="{{ "js/site.js" | relURL }}" defer data-prev="{{ i18n "prevSlide" }}" data-next="{{ i18n "nextSlide" }}" data-slide="{{ i18n "slideLabel" }}" data-page="{{ i18n "pageLabel" }}"></script>
</body>
</html>
